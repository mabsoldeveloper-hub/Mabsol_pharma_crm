<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mabsol Pharma CRM - Reset License Key</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-user-select: none;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .logo-badge {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 16px rgba(239, 68, 68, 0.3);
    }
    .logo-badge svg { width: 28px; height: 28px; fill: #ffffff; }
    h1 { font-size: 20px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
    p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
    .field { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 11px; font-weight: 600; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    input[type="email"], input[type="text"] {
      width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: #f8fafc; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #3b82f6; }
    button.btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); margin-top: 8px;
    }
    button.btn-danger {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-msg { margin-top: 14px; font-size: 12px; padding: 10px; border-radius: 6px; display: none; }
    .status-msg.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .status-msg.success { display: block; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
    </div>
    <h1>Reset License Key</h1>
    <p class="subtitle">To change your license key, verify your registered admin email address with OTP.</p>

    <!-- STEP 1: Enter Email -->
    <div id="stepEmail">
      <div class="field">
        <label for="emailInput">Registered Admin Email</label>
        <input type="email" id="emailInput" placeholder="rahulavashist@gmail.com" value="" autocomplete="off" />
      </div>
      <button id="sendOtpBtn" class="btn">Send Verification OTP</button>
    </div>

    <!-- STEP 2: Enter OTP -->
    <div id="stepOtp" style="display: none;">
      <div class="field">
        <label for="otpInput">6-Digit Verification Code</label>
        <input type="text" id="otpInput" placeholder="123456" maxLength="6" style="letter-spacing: 4px; text-align: center;" autocomplete="off" />
      </div>
      <button id="verifyOtpBtn" class="btn btn-danger">Verify & Reset Key</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    const stepEmail = document.getElementById('stepEmail');
    const stepOtp = document.getElementById('stepOtp');
    const emailInput = document.getElementById('emailInput');
    const otpInput = document.getElementById('otpInput');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');
    const statusMsg = document.getElementById('statusMsg');

    let currentEmail = '';

    function showStatus(msg, type) {
      statusMsg.innerText = msg;
      statusMsg.className = `status-msg ${type}`;
    }

    sendOtpBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email || !email.includes('@')) {
        showStatus('Please enter a valid registered email address.', 'error');
        return;
      }

      sendOtpBtn.disabled = true;
      sendOtpBtn.innerText = 'Sending OTP...';
      statusMsg.className = 'status-msg';

      try {
        if (window.electronAPI && window.electronAPI.sendResetOtp) {
          const res = await window.electronAPI.sendResetOtp(email);
          if (res.success) {
            currentEmail = email;
            stepEmail.style.display = 'none';
            stepOtp.style.display = 'block';
            showStatus('Verification code sent to ' + email, 'success');
          } else {
            showStatus(res.message || 'Failed to send verification code.', 'error');
            sendOtpBtn.disabled = false;
            sendOtpBtn.innerText = 'Send Verification OTP';
          }
        } else {
          showStatus('IPC bridge unavailable.', 'error');
          sendOtpBtn.disabled = false;
          sendOtpBtn.innerText = 'Send Verification OTP';
        }
      } catch (err) {
        showStatus('Error sending OTP: ' + err.message, 'error');
        sendOtpBtn.disabled = false;
        sendOtpBtn.innerText = 'Send Verification OTP';
      }
    });

    verifyOtpBtn.addEventListener('click', async () => {
      const otp = otpInput.value.trim();
      if (otp.length !== 6) {
        showStatus('Please enter all 6 digits of the OTP code.', 'error');
        return;
      }

      verifyOtpBtn.disabled = true;
      verifyOtpBtn.innerText = 'Verifying & resetting key...';
      statusMsg.className = 'status-msg';

      try {
        if (window.electronAPI && window.electronAPI.verifyResetOtp) {
          const res = await window.electronAPI.verifyResetOtp(currentEmail, otp);
          if (res.success) {
            showStatus('OTP verified! Resetting license key and relaunching...', 'success');
          } else {
            showStatus(res.message || 'Incorrect verification code. Please try again.', 'error');
            verifyOtpBtn.disabled = false;
            verifyOtpBtn.innerText = 'Verify & Reset Key';
          }
        } else {
          showStatus('IPC bridge unavailable.', 'error');
          verifyOtpBtn.disabled = false;
          verifyOtpBtn.innerText = 'Verify & Reset Key';
        }
      } catch (err) {
        showStatus('Verification error: ' + err.message, 'error');
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.innerText = 'Verify & Reset Key';
      }
    });
  </script>
</body>
</html>
