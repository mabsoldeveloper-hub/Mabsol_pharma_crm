<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mabsol Pharma CRM - Desktop Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-user-select: none;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .badge {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.35);
    }
    .badge svg { width: 36px; height: 36px; fill: #ffffff; }
    h1 { font-size: 22px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
    p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 28px; line-height: 1.5; }
    
    button.btn-sso {
      width: 100%;
      padding: 14px 18px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    button.btn-sso:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
    }

    .divider {
      margin: 24px 0;
      display: flex;
      align-items: center;
      color: #475569;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #334155;
    }
    .divider span { padding: 0 12px; }

    .key-section {
      text-align: left;
    }
    label { display: block; font-size: 11px; font-weight: 600; color: #cbd5e1; text-transform: uppercase; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: #f8fafc; font-size: 13px; font-family: monospace; outline: none;
    }
    button.btn-secondary {
      width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155;
      color: #cbd5e1; font-size: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 8px;
    }

    .status-msg {
      margin-top: 18px; font-size: 12.5px; padding: 10px 14px; border-radius: 8px; display: none;
    }
    .status-msg.info { display: block; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: #93c5fd; }
    .status-msg.success { display: block; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
    .status-msg.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }

    .dots span {
      display:inline-block; width:6px; height:6px; border-radius:50%; background:#3b82f6; margin:0 2px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay:0.2s; }
    .dots span:nth-child(3) { animation-delay:0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:scale(0.6);opacity:0.5} 40%{transform:scale(1);opacity:1} }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
    </div>
    <h1>Mabsol Pharma CRM</h1>
    <p class="subtitle">Sign in via your web browser (phcrm.mabsolinfotech.cloud) to authorize and access the desktop application.</p>

    <!-- Browser SSO Button -->
    <button id="ssoBtn" class="btn-sso">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      Sign in with Web Browser
    </button>

    <div id="statusMsg" class="status-msg"></div>

    <div class="divider"><span>Or Use Product Key</span></div>

    <!-- Product Key Fallback -->
    <div class="key-section">
      <label for="licenseKey">Product Key</label>
      <input type="text" id="licenseKey" placeholder="MABSOL-XXXX-XXXX-XXXX" autocomplete="off" />
      <button id="keyBtn" class="btn-secondary">Activate with Key</button>
    </div>
  </div>

  <script>
    const ssoBtn = document.getElementById('ssoBtn');
    const keyBtn = document.getElementById('keyBtn');
    const keyInput = document.getElementById('licenseKey');
    const statusMsg = document.getElementById('statusMsg');

    function showStatus(html, type) {
      statusMsg.innerHTML = html;
      statusMsg.className = `status-msg ${type}`;
    }

    ssoBtn.addEventListener('click', async () => {
      ssoBtn.disabled = true;
      showStatus('Browser window opened... Waiting for authentication <span class="dots"><span></span><span></span><span></span></span>', 'info');

      try {
        if (window.electronAPI && window.electronAPI.openBrowserSso) {
          window.electronAPI.openBrowserSso();
        }
      } catch (err) {
        showStatus('Error launching browser: ' + err.message, 'error');
        ssoBtn.disabled = false;
      }
    });

    keyBtn.addEventListener('click', async () => {
      const key = keyInput.value.trim();
      if (!key) {
        showStatus('Please enter a valid product key.', 'error');
        return;
      }
      keyBtn.disabled = true;
      try {
        if (window.electronAPI && window.electronAPI.activateKey) {
          const res = await window.electronAPI.activateKey(key);
          if (res.success) {
            showStatus('Key activated successfully! Launching...', 'success');
          } else {
            showStatus(res.error || 'Invalid product key.', 'error');
            keyBtn.disabled = false;
          }
        }
      } catch (err) {
        showStatus('Error: ' + err.message, 'error');
        keyBtn.disabled = false;
      }
    });

    // Listen for SSO callback event from IPC
    if (window.electronAPI && window.electronAPI.onSsoCompleted) {
      window.electronAPI.onSsoCompleted((data) => {
        showStatus(`✓ Authentication completed for <strong>${data.user || 'User'}</strong>! Launching app...`, 'success');
      });
    }
  </script>
</body>
</html>
